name: CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy or uninstall"
        type: choice
        options: [deploy, uninstall]
        default: deploy

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-ai-rag-chatbot
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
  REGISTRY: ${{ vars.ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: ai-rag-chatbot
  RELEASE: northwind

jobs:
  test:
    name: Run tests
    if: github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  deploy:
    name: Build, push and deploy
    needs: test
    if: github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required settings
        run: |
          if [ -z "${{ vars.ALLOWED_CIDR }}" ]; then
            echo "::error::Set the ALLOWED_CIDR variable (your IP, for example 203.0.113.10/32)"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        run: |
          docker build -t "$REGISTRY/northwind-wiki:$IMAGE_TAG" wiki
          docker build -t "$REGISTRY/ai-rag-chatbot:$IMAGE_TAG" .
          docker push "$REGISTRY/northwind-wiki:$IMAGE_TAG"
          docker push "$REGISTRY/ai-rag-chatbot:$IMAGE_TAG"

      - uses: azure/setup-helm@v4

      - name: Connect to EKS
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: Create or update the secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WIKI_API_TOKEN: ${{ secrets.WIKI_API_TOKEN }}
          RAG_API_TOKEN: ${{ secrets.RAG_API_TOKEN }}
        run: |
          kubectl create secret generic northwind-secrets -n "$NAMESPACE" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --from-literal=WIKI_API_TOKEN="$WIKI_API_TOKEN" \
            --from-literal=RAG_API_TOKEN="$RAG_API_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm deploy
        env:
          ALLOWED_CIDR: ${{ vars.ALLOWED_CIDR }}
          BEDROCK_ROLE_ARN: ${{ vars.BEDROCK_ROLE_ARN }}
        run: |
          HOST=$(kubectl get ingress "$RELEASE-wiki" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          PUBLIC_URL="http://${HOST:-pending}"
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

          EXTRA=()
          if [ -n "$BEDROCK_ROLE_ARN" ]; then
            EXTRA+=(--set-string "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$BEDROCK_ROLE_ARN")
          fi

          helm lint helm/northwind -f helm/northwind/values-eks.yaml
          helm upgrade --install "$RELEASE" helm/northwind -n "$NAMESPACE" \
            -f helm/northwind/values-eks.yaml \
            --set wiki.image.repository="$REGISTRY/northwind-wiki" \
            --set wiki.image.tag="$IMAGE_TAG" \
            --set rag.image.repository="$REGISTRY/ai-rag-chatbot" \
            --set rag.image.tag="$IMAGE_TAG" \
            --set wiki.publicUrl="$PUBLIC_URL" \
            --set "ingress.allowedCidrs={$ALLOWED_CIDR}" \
            "${EXTRA[@]}" \
            --wait --timeout 15m

      - name: Wait for the load balancer
        run: |
          for i in $(seq 1 40); do
            HOST=$(kubectl get ingress "$RELEASE-wiki" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOST" ]; then echo "ALB: $HOST"; echo "ALB_HOST=$HOST" >> "$GITHUB_ENV"; exit 0; fi
            echo "Waiting for the ALB ($i/40)"; sleep 15
          done
          echo "::error::The ALB did not get a hostname. Check: kubectl describe ingress $RELEASE-wiki -n $NAMESPACE"
          exit 1

      - name: Point citation links at the ALB and re-index
        run: |
          NEW_URL="http://$ALB_HOST"
          if [ "$NEW_URL" != "$PUBLIC_URL" ]; then
            helm upgrade "$RELEASE" helm/northwind -n "$NAMESPACE" --reuse-values \
              --set wiki.publicUrl="$NEW_URL" --wait --timeout 15m
          fi
          # Re-index so every chunk carries the public wiki URL
          kubectl exec -n "$NAMESPACE" deploy/"$RELEASE"-rag -c rag -- python -m app.ingest

      - name: Smoke test
        run: |
          kubectl get pods,pvc,ingress -n "$NAMESPACE"
          {
            echo "### Northwind deployed (namespace \`$NAMESPACE\`)"
            echo "- Wiki: http://$ALB_HOST (open from your allowed IP: \`${{ vars.ALLOWED_CIDR }}\`)"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- The first time, DNS for the ALB can take 1-3 minutes."
          } >> "$GITHUB_STEP_SUMMARY"

  uninstall:
    name: Uninstall
    if: github.event.inputs.action == 'uninstall'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: azure/setup-helm@v4
      - name: Uninstall release (also removes the ALB and EBS volumes)
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          helm uninstall "$RELEASE" -n "$NAMESPACE" --wait || echo "Release not installed"
          kubectl delete pvc --all -n "$NAMESPACE" --ignore-not-found
          kubectl delete secret northwind-secrets -n "$NAMESPACE" --ignore-not-found

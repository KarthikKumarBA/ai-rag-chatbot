{{- if .Values.networkPolicy.enabled }}
# Only wiki pods can reach the RAG API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-rag
  labels:
    {{- include "northwind.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "northwind.rag.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "northwind.wiki.selector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wiki
  labels:
    {{- include "northwind.labels" . | nindent 4 }}
    app.kubernetes.io/name: wiki
spec:
  replicas: 1   # SQLite on a ReadWriteOnce volume: single replica
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "northwind.wiki.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "northwind.labels" . | nindent 8 }}
        app.kubernetes.io/name: wiki
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: wiki
          image: "{{ .Values.wiki.image.repository }}:{{ .Values.wiki.image.tag }}"
          imagePullPolicy: {{ .Values.wiki.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-wiki-config
          env:
            # The wiki gets only the tokens it needs - never the LLM keys
            {{- range $key := list "WIKI_API_TOKEN" "RAG_API_TOKEN" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "northwind.secretName" $ }}
                  key: {{ $key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.wiki.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          {{- if .Values.wiki.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wiki-data
          {{- else }}
          emptyDir: {}
          {{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-wiki
  labels:
    {{- include "northwind.labels" . | nindent 4 }}
    app.kubernetes.io/name: wiki
spec:
  type: {{ .Values.wiki.service.type }}
  selector:
    {{- include "northwind.wiki.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.wiki.service.port }}
      targetPort: http

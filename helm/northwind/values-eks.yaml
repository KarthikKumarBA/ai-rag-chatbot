# AWS EKS. Image repository/tag, publicUrl and allowedCidrs are set by the CD workflow.
wiki:
  image:
    repository: REPLACED_BY_CD
    tag: REPLACED_BY_CD
    pullPolicy: IfNotPresent
  publicUrl: "http://pending"
  persistence:
    storageClass: gp3
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

rag:
  image:
    repository: REPLACED_BY_CD
    tag: REPLACED_BY_CD
    pullPolicy: IfNotPresent
  persistence:
    storageClass: gp3
    size: 10Gi
  config:
    LLM_PROVIDER: openai
    EMBEDDING_PROVIDER: openai
    AWS_REGION: us-east-1
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi

serviceAccount:
  create: true
  annotations: {}

ingress:
  enabled: true
  className: alb
  host: ""
  # Only these IPs may open the wiki (set from the ALLOWED_CIDR GitHub variable)
  allowedCidrs: []
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/group.name: shared-apps
    # HTTPS: add an ACM certificate and change listen-ports to [{"HTTP": 80}, {"HTTPS": 443}]
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
    # alb.ingress.kubernetes.io/ssl-redirect: "443"

networkPolicy:
  enabled: true
